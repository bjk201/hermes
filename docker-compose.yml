version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pvrechner}"
      POSTGRES_USER: "${POSTGRES_USER:-pvuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pvpass}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pvuser} -d ${POSTGRES_DB:-pvrechner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-pvrechner}"
      POSTGRES_USER: "${POSTGRES_USER:-pvuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pvpass}"
      APP_PASSWORD: "${APP_PASSWORD:-pv2024}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
    ports:
      - "${APP_PORT:-8080}:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
