version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-pvrechner}"
      POSTGRES_USER: "${POSTGRES_USER:-pvuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGEME}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pvuser} -d ${POSTGRES_DB:-pvrechner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: https://github.com/bjk201/hermes.git#feature/pv-rechner
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-pvrechner}"
      POSTGRES_USER: "${POSTGRES_USER:-pvuser}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGEME}"
      APP_PASSWORD: "${APP_PASSWORD:-pv2024}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production-2026}"
    ports:
      - "${APP_PORT:-3333}:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
